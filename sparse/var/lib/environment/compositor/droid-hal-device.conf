# Config for motorola/victara
EGL_PLATFORM=drm
QT_QPA_PLATFORM=eglfs
QT_QPA_EGLFS_INTEGRATION=eglfs_kms
QT_QPA_EGLFS_KMS_CONFIG=/etc/eglfs-config.json
QT_QPA_EGLFS_PHYSICAL_WIDTH=65
QT_QPA_EGLFS_PHYSICAL_HEIGHT=115
# Determine which node is your touchscreen by checking /dev/input/event*
LIPSTICK_OPTIONS -plugin evdevkeyboard:keymap=/usr/share/qt5/keymaps/droid.qmap
