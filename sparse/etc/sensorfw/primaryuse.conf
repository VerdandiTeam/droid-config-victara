[plugins]
accelerometeradaptor = iioaccelerometeradaptor
alsadaptor = iioalsadaptor
proximityadaptor = iioproximityadaptor
magnetometeradaptor = iiomagnetometeradaptor
gyroscopeadaptor = iiogyroscopeadaptor

[als]
input_match = stm401-light
mode = 0

[proximity]
input_match = stm401-proximity
mode = 0
threshold = 1

[accelerometer]
input_match = stm401-accel
mode = 0
transformation_matrix = "1,0,0,0,1,0,0,0,1"

[gyroscope]
input_match = stm401-gyro
mode = 0

[magnetometer]
input_match = stm401-magn
mode = 0
scale_coefficient = 1
transformation_matrix = "-1,0,0,0,1,0,0,0,1"
needs_calibration = 1
