[configfs]
gadget_base_directory = /sys/kernel/config/usb_gadget/g1
function_rndis        = rndis.usb0
function_mtp          = ffs.mtp
gadget_conf_directory = configs/c.1
gadget_udc_device     = ci_hdrc.0

[network]
interface = usb0

[udev]
extcon_path = /sys/class/extcon/extcon0
android_tracking = 0
extcon_tracking = 1
